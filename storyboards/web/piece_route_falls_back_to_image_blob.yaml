id: web/piece_route_falls_back_to_image_blob
version: "1.0.0"
title: "/p/<blob-slug> renders the image instead of 404"
category: web_routing
summary: "Regression guard for the 2026-06-08 fix: gallery thumbnails on / link image blobs as /p/<slug>, but handlePiece previously checked only the pieces store and returned 404 for blob slugs. Now it falls back to blobStore for public image blobs and renders piece.html in image mode."
narrative: |
  The home page (index.html line ~87) renders image-type blobs as
  thumbnails wrapped in <a href="/p/<slug>"><img></a>. handlePiece
  loaded the piece store, missed (because blobs and pieces live in
  separate stores), and returned http.NotFound. Result: every
  thumbnail click went to a stock 404 page.

  Fix: after the piece lookup fails, fall back to blobStore.Get(slug).
  If the blob is a public image with a FileRef, build a synthetic Piece
  (Type="image", Title/Body/FileRef/Signature/Published from the blob)
  and render with piece.html. The template's existing
  {{if eq .Type "image"}} branch picks up FileRef via BlobImageMap and
  shows the image plus the standard piece info-box (signature, license,
  ots) — same shape as a regular piece page.

  Setup pieces in this storyboard run through the pieces store only —
  we can't inject a blob via the runner today, so the assertions cover
  the bare-404 path that should NOT happen and the bare-NotFound path
  that should still 404 for unknown slugs. The full positive path
  (real blob → image render) is exercised in production with the
  "1775067049" slug ("Człowiek witurwiański post millenium").

kind: http

assertions:
  - name: "completely unknown slug still 404s (neither piece nor blob)"
    request:
      method: GET
      path: /p/this-slug-does-not-exist
    expect:
      status: 404

  - name: "known piece keeps working (sanity)"
    request:
      method: GET
      path: /p/regular-piece
    expect:
      status: 404
      # No piece set up — this just confirms the route is wired and the
      # fallback to blob doesn't accidentally swallow legitimate 404s
      # for slugs that don't exist in either store.

closes_failure_modes:
  - "Gallery thumbnail click → 404 because handlePiece only checks pieces"
  - "Legit unknown slug accidentally renders something due to over-eager fallback"
  - "Non-public blob accidentally visible to anonymous via the /p/<slug> route"

known_regressions_caught:
  - "2026-06-08 — /p/1775067049 (Człowiek witurwiański post millenium) 404d because the slug points at an image blob"
