id: web/dashboard_rotation_period_matches_code
version: "1.0.0"
title: "Owner-facing dashboards advertise the actual session-rotation period"
category: web_owner_ui
summary: "Regression guard: copy on /dashboard and /mc must agree with PickActivePoem's rotation cadence (currently hourly via Unix()/3600). When the period changes, this storyboard fails loud."
narrative: |
  On 2026-06-08 an audit found that /dashboard claimed "rotacja
  automatyczna co 24h" while /mc said "rotation hourly" — the code
  (config.go PickActivePoem) divides Unix seconds by 3600, so the
  truth is hourly. The PL copy was the lie.

  The risk of letting these drift again: kapoost gives an agent the
  session code, the agent assumes 24h validity, the code expires
  after an hour, the agent's chain-of-thought blames the wrong layer.

  This storyboard pins both surfaces to the same period word. If the
  rotation cadence changes (e.g. to 30 minutes or 24 hours), the
  failing assertion lists every place the copy must be updated in
  lockstep.

kind: http

assertions:
  - name: "/dashboard PL copy mentions 1h rotation"
    request:
      method: GET
      path: /dashboard
      owner: true
    expect:
      status: 200
      body_contains:
        - "rotacja automatyczna co 1h"
      body_does_not_contain:
        - "co 24h"

  - name: "/mc EN copy mentions hourly rotation"
    request:
      method: GET
      path: /mc
      owner: true
    expect:
      status: 200
      body_contains:
        - "rotation hourly"

closes_failure_modes:
  - "Two owner-facing surfaces describe the rotation period differently"
  - "Copy drifts away from PickActivePoem's actual hourKey divisor"
  - "Agent assumes wrong session TTL because of misleading UI text"

known_regressions_caught:
  - "2026-06-08 — dashboard claimed 24h, mc claimed hourly, code was hourly"
